name: 'Manually'

on:
    workflow_dispatch:
        inputs:
            task:
                description: '选择任务'
                type: choice
                required: true
                options:
                    - linkModifier
                    - monthly

env:
    API_USER_AGENT: ${{ secrets.API_USER_AGENT }}
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    ZH_BOT: ${{ secrets.ZH_BOT }}

jobs:
    # 说明: 根据配置文件替换页面中的链接目标
    linkModifier:
        if: |
            github.event.inputs.task == 'linkModifier'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/mgp/linkModifier.ts

    # 说明: 向订阅用户发送萌娘百科月报
    monthly:
        if: |
            github.event.inputs.task == 'monthly'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/mgp/monthly.ts
