name: 'UEW daily'

on:
    schedule:
        - cron: '10 16 * * *' # 00:10 CST Everyday
        - cron: '30 16 * * *' # 00:30 CST Everyday
        - cron: '30 16 * * 2' # 00:30 CST Wednesday
        - cron: '30 20 * * *' # 04:30 CST Everyday
    workflow_dispatch:
        inputs:
            task:
                description: '选择任务'
                type: choice
                required: true
                options:
                    - cleanSandbox
                    - invisibleCharacter
                    - countdown
                    - archiveThread

env:
    API_USER_AGENT: ${{ secrets.API_USER_AGENT }}
    UEW_CF: ${{ secrets.UEW_CF }}
    UEW_BOT: ${{ secrets.UEW_BOT }}
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    # 说明: 清理沙盒
    cleanSandbox:
        if: |
            github.event.schedule == '30 20 * * *' ||
            github.event.inputs.task == 'cleanSandbox'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/uew/cleanSandbox.ts

    # 说明: 移除不可见字符
    invisibleCharacter:
        if: |
            github.event.schedule == '30 16 * * 2' ||
            github.event.inputs.task == 'invisibleCharacter'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/uew/invisibleCharacter.ts

    # 说明: 更新上映倒计时
    countdown:
        if: |
            github.event.schedule == '30 16 * * *' ||
            github.event.inputs.task == 'countdown'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/uew/countdown.ts

    # 说明: 每月 1 号存档会议大厅超过 5 天无回复的讨论串
    archiveThread:
        if: |
            github.event.schedule == '10 16 * * *' ||
            github.event.inputs.task == 'archiveThread'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/uew/archiveThread.ts
