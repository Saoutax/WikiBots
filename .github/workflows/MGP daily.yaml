name: 'MGP daily'

on:
    schedule:
        - cron: '20 1,13 * * *' # 09:20 21:20 CST Everyday
        - cron: '10 16 * * 5' # 00:10 CST Saturday
        - cron: '00 20 * * *' # 04:00 CST Everyday
        - cron: '00 19 * * 3' # 03:00 CST Thursday
        - cron: '00 21 * * 5' # 05:00 CST Saturday
        - cron: '00 18 * * 2' # 02:00 CST Wednesday
        - cron: '00 17 * * *' # 01:00 CST Everyday
        - cron: '00 22 * * 6' # 06:00 CST Sunday
    workflow_dispatch:
        inputs:
            task:
                description: '选择任务'
                type: choice
                required: true
                options:
                    - deleteRedirect
                    - markImg
                    - highRiskCount
                    - deleteUnused
                    - disambigLinks
                    - correctNavFormat
                    - removeExtraPipe
                    - templateStyles

env:
    API_USER_AGENT: ${{ secrets.API_USER_AGENT }}
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    ZH_BOT: ${{ secrets.ZH_BOT }}
    CM_BOT: ${{ secrets.CM_BOT }}

jobs:
    # 说明: 删除昨日无使用的共享站移动残留重定向
    deleteRedirect:
        if: |
            github.event.schedule == '20 1,13 * * *' ||
            github.event.inputs.task == 'deleteRedirect'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/mgp/deleteRedirect.ts

    # 说明: 根据`#疑似外链调用内部文件`为文件添加{{非链入使用}}模板
    markImg:
        if: |
            github.event.schedule == '00 20 * * *' ||
            github.event.inputs.task == 'markImg'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/mgp/markImg.ts

    # 说明: 更新被标记{{Highrisk}}的模板使用数量
    highRiskCount:
        if: |
            github.event.schedule == '00 19 * * 3' ||
            github.event.inputs.task == 'highRiskCount'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/mgp/highRiskCount.ts

    # 说明: 删除特定分类下的无使用文件
    deleteUnused:
        if: |
            github.event.schedule == '00 21 * * 5' ||
            github.event.inputs.task == 'deleteUnused'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/mgp/deleteUnused.ts

    # 说明: 更新[萌娘百科:疑似链入消歧义页面的条目](https://mzh.moegirl.org.cn/_?curid=545554)
    disambigLinks:
        if: |
            github.event.schedule == '10 16 * * 5' ||
            github.event.inputs.task == 'disambigLinks'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/mgp/disambigLinks.ts

    # 说明: 修复{{Navbox}}常见错误排版
    correctNavFormat:
        if: |
            github.event.schedule == '00 18 * * 2' ||
            github.event.inputs.task == 'correctNavFormat'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/mgp/correctNavFormat.ts

    # 说明: 扫描最近更改，移除多余的管道符
    removeExtraPipe:
        if: |
            github.event.schedule == '00 17 * * *' ||
            github.event.inputs.task == 'removeExtraPipe'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/mgp/removeExtraPipe.ts

    # 说明: 为使用模板样式表的模板补充{{TemplateStyles}}标记
    templateStyles:
        if: |
            github.event.schedule == '00 22 * * 6' ||
            github.event.inputs.task == 'templateStyles'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
              with:
                  node-version: '24.4.1'
            - name: Run Script
              run: npx tsx src/bot/mgp/templateStyles.ts
