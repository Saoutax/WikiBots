name: 'QW daily'

on:
    schedule:
        # - cron: '15 */3 * * *' # Every 3 hours (08:15 11:15 14:15 17:20 ... CST)
        - cron: '10 16 * * *' # 00:10 CST Everyday
    workflow_dispatch:
        inputs:
            task:
                description: '选择任务'
                type: choice
                required: true
                options:
                    - internalLink
                    - internalLink-exist
                    - nullEdit
                    - archiveTEA
                    - archiveRFRD
                    - archiveRFES
                    - archiveRFR
                    - archiveCV
                    - archiveNotability
                    - archiveFileCSD
                    - archiveFAC
            category:
                description: '分类'
                type: string
                required: false
                default: '有蓝链却未移除内部链接助手模板的页面'

env:
    API_USER_AGENT: ${{ secrets.API_USER_AGENT }}
    QW_BOT: ${{ secrets.QW_BOT }}
    FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
    FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
    FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
    FEISHU_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_RECEIVE_ID_TYPE }}

jobs:
    # 说明: 移除已弃用的内部链接助手模板
    internalLink:
        if: |
            github.event.inputs.task == 'internalLink'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
            - name: Run Script
              run: npx tsx src/bot/qw/internalLink.ts

    # 说明: 处理「有蓝链却未移除内部链接助手模板的页面」分类：移除残留模板，无模板时零编辑
    internalLink-exist:
        if: |
            github.event.inputs.task == 'internalLink-exist'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
            - name: Run Script
              run: npx tsx src/bot/qw/internalLink-exist.ts

    # 说明: 对指定分类下的页面批量零编辑
    nullEdit:
        if: |
            github.event.inputs.task == 'nullEdit'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
            - name: Run Script
              env:
                  CATEGORY: ${{ github.event.inputs.category }}
              run: npx tsx src/bot/qw/nullEdit.ts

    # 说明: 存档茶馆中 7 天无回复的讨论串
    archiveTEA:
        if: |
            github.event.schedule == '10 16 * * *' ||
            github.event.inputs.task == 'archiveTEA'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
            - name: Run Script
              run: npx tsx src/bot/qw/archiveTEA.ts

    # 说明: 存档版本删除提报中已处理的提报
    archiveRFRD:
        if: |
            github.event.schedule == '10 16 * * *' ||
            github.event.inputs.task == 'archiveRFRD'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
            - name: Run Script
              run: npx tsx src/bot/qw/archiveRFRD.ts

    # 说明: 存档条目署名申请中已处理的申请
    archiveRFES:
        if: |
            github.event.schedule == '10 16 * * *' ||
            github.event.inputs.task == 'archiveRFES'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
            - name: Run Script
              run: npx tsx src/bot/qw/archiveRFES.ts

    # 说明: 存档各权限申请板块中已处理的申请
    archiveRFR:
        if: |
            github.event.schedule == '10 16 * * *' ||
            github.event.inputs.task == 'archiveRFR'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
            - name: Run Script
              run: npx tsx src/bot/qw/archiveRFR.ts

    # 说明: 存档侵权提报中已处理的提报
    archiveCV:
        if: |
            github.event.schedule == '10 16 * * *' ||
            github.event.inputs.task == 'archiveCV'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
            - name: Run Script
              run: npx tsx src/bot/qw/archiveCV.ts

    # 说明: 存档关注度提报中已处理的提报
    archiveNotability:
        if: |
            github.event.schedule == '10 16 * * *' ||
            github.event.inputs.task == 'archiveNotability'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
            - name: Run Script
              run: npx tsx src/bot/qw/archiveNotability.ts

    # 说明: 存档文件快速删除提报中已处理的提报
    archiveFileCSD:
        if: |
            github.event.schedule == '10 16 * * *' ||
            github.event.inputs.task == 'archiveFileCSD'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
            - name: Run Script
              run: npx tsx src/bot/qw/archiveFileCSD.ts

    # 说明: 存档内容评选中已结束的评选
    archiveFAC:
        if: |
            github.event.schedule == '10 16 * * *' ||
            github.event.inputs.task == 'archiveFAC'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Bot
              uses: ./.github/actions/setup-bot
            - name: Run Script
              run: npx tsx src/bot/qw/archiveFAC.ts
