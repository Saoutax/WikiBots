name: 'Generate READMEs'

on:
    push:
        branches:
            - '**'
        paths:
            - '.github/workflows/**'
            - 'scripts/generateSiteReadmes.ts'
            - 'scripts/lib/readmes.ts'
    workflow_dispatch:

concurrency:
    group: generate-readmes-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    generate-readmes:
        name: Generate Site READMEs
        if: ${{ github.actor != 'github-actions[bot]' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.ref_name }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Bot
              uses: ./.github/actions/setup-bot

            - name: Generate READMEs
              run: pnpm readme

            - name: Commit and push
              run: |
                  if [ -z "$(git status --porcelain -- 'src/bot/*/README.md')" ]; then
                      echo 'No README changes.'
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -- 'src/bot/*/README.md'
                  git commit -m 'chore: auto generate site READMEs'
                  git push origin "HEAD:${GITHUB_REF_NAME}" || {
                      git pull --rebase --autostash
                      git push origin "HEAD:${GITHUB_REF_NAME}"
                  }
