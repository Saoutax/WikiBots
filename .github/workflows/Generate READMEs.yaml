name: 'Generate READMEs'

on:
    push:
        branches:
            - '**'
        paths:
            - '.github/workflows/**'
            - 'scripts/generateSiteReadmes.ts'
            - 'scripts/lib/readmes.ts'
    workflow_dispatch:

env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
    group: generate-readmes-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    generate-readmes:
        name: Generate Site READMEs
        if: ${{ github.actor != 'github-actions[bot]' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bot
              uses: ./.github/actions/setup-bot

            - name: Generate READMEs
              run: pnpm readme

            - name: Commit READMEs
              run: npx tsx scripts/commitSiteReadmes.ts
