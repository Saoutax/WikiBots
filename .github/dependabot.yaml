version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: daily
      groups:
          oxc:
              patterns:
                  - 'oxfmt*'
                  - 'oxlint*'
                  - 'oxc-*'
                  - '@oxc*'
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: daily
